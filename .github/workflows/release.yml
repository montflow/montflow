# Effect-style release, adapted for Bun. Scoped to the workspace packages
# whose local version is not yet on npm (private and changeset-ignored packages
# excluded). Push to `main`:
# - setup installs dependencies once, warms the shared store cache, and
#   computes the set of packages being released.
# - checks (test, typecheck, lint, format) run in parallel off that cache,
#   only for the packages being released.
# - PRs carrying a changeset file -> "Version Packages" PR is opened/updated.
# - Merging that PR (all checks green) -> publishes to npm.
#
# NOTE: every job runs on a fresh runner with no shared filesystem, so each
# job still runs `bun install` — but with the store cache warm it only links
# (seconds). Sharing node_modules itself (700MB+) through the cache would be
# slower than re-linking. What `setup` centralizes is the network download:
# it happens once per lockfile change instead of once per job.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  setup:
    name: Setup dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.release.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determine packages to release
        id: release
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');

          const ignored = new Set(
            JSON.parse(fs.readFileSync('.changeset/config.json', 'utf8')).ignore ?? [],
          );
          const manifests = [];

          for (const dir of ['packages', 'tooling', 'apps']) {
            if (!fs.existsSync(dir)) continue;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (!entry.isDirectory()) continue;
              const file = path.join(dir, entry.name, 'package.json');
              if (!fs.existsSync(file)) continue;
              const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (manifest.private || !manifest.version || ignored.has(manifest.name)) continue;
              manifests.push(manifest);
            }
          }

          const packages = [];
          for (const { name, version } of manifests) {
            let published = '';
            try {
              published = execFileSync('npm', ['view', `${name}@${version}`, 'version'], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              }).trim();
            } catch {
              published = '';
            }
            if (published !== version) packages.push(name);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `packages=${JSON.stringify(packages)}\n`);
          NODE

  checks:
    name: ${{ matrix.name }} (${{ matrix.package }})
    needs: [setup]
    if: needs.setup.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        package: ${{ fromJSON(needs.setup.outputs.packages) }}
        name:
          - test
          - typecheck
          - lint
          - format
        include:
          - name: test
            script: test
          - name: typecheck
            script: ts:check
          - name: lint
            script: lint:check
          - name: format
            script: format:check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Restore Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.name }}
        run: bun run --filter ${{ matrix.package }} ${{ matrix.script }}

  release:
    name: Release
    needs: [checks]
    if: ${{ !cancelled() && needs.checks.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Required so the token below (not the default token) is used when
          # pushing to the changesets release branch. Otherwise actions on
          # that branch will not be triggered.
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Restore Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@11

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run changeset:version
          publish: bun run changeset:publish
        env:
          # PAT (not the automatic GITHUB_TOKEN) so workflows trigger on the
          # changesets release branch. See README/getting-started for setup.
          GITHUB_TOKEN: ${{ secrets.CHANGESET_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
