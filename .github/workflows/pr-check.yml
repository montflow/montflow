# PR shape check.
#
# Lightweight on purpose: no install and no build. It reads the pull request
# from `github.event` and enforces the repo's PR convention — `main` as the
# base, then the title and body against the PR body standard that agents run
# locally as `mf-mode pr check` — so a malformed PR fails in seconds instead
# of at merge time. The standard lives in packages/mf-mode/src/modules/pr,
# which imports nothing, so bare Bun runs it from a sparse checkout. The heavy
# verification stays in `verify.yml`.
#
# Boundary: this workflow never runs tests, lints, or typechecks. Hooks
# cannot cover a PR title or body (they only see local commits/pushes);
# `pr-check.yml` only runs on GitHub, never locally.
name: PR check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: PR shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Check base is main
        run: |
          if [ "$BASE_REF" != "main" ]; then
            echo "::error::base must be main, got $BASE_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          sparse-checkout: packages/mf-mode

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Check title and body against the PR body standard
        run: printf '%s' "$PR_BODY" | bun packages/mf-mode/scripts/pr-check.ts --title "$PR_TITLE" --human
