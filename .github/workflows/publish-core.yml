name: Publish @montflow/core

on:
  push:
    branches:
      - release/core

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run --filter @montflow/core typecheck

      - name: Run tests
        run: pnpm run --filter @montflow/core test

      - name: Build and publish to npm
        run: pnpm run --filter @montflow/core release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
