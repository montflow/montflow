name: Publish @montflow/core

on:
  push:
    branches:
      - release/core

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run --filter @montflow/core ts:check

      - name: Run tests
        run: bun run --filter @montflow/core test

      - name: Build and publish to npm
        run: bun run --filter @montflow/core release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}