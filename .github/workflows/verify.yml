# Repo-wide verification gate.
#
# Runs on every push, pull request, merge queue entry, and on demand, so a
# failure is caught before it lands on `main` instead of after.
#
# Shape:
#   install  -> checkout, `bun install`, pack the workspace *including*
#               `node_modules` into one artifact.
#   build    -> restore that artifact, run every package build once, repack
#               the workspace *including* the build outputs (and Turbo's
#               local cache) into the same artifact name.
#   verify   -> matrix of independent checks. Each cell restores the built
#               workspace, so install and build happen exactly once per run
#               instead of once per check. The matrix then runs fully in
#               parallel.
#
# The workspace travels as a single `tar` (not as loose files) because
# `node_modules` is full of symlinks and hardlinks, and zip-based artifacts
# do not round-trip those correctly. `.git` is excluded; each job does its own
# `actions/checkout` so Turborepo keeps a stable git root for its hashing.
#
# `TURBO_CACHE_DIR` is pointed at `.turbo/cache` inside the workspace so the
# cache built by the `build` job travels with the artifact. The verify cells
# then satisfy their `^build` dependencies from that cache instead of
# rebuilding their dependencies.
#
# Each matrix cell runs one check through a root script (`package.json`) so a
# failure names a single target and CI, the local `mf:gate` script,
# and the Lefthook pre-push hook all execute the same commands.
#
# Boundary with `release.yml`: that workflow is untouched. Its `checks` job
# runs per-package test/typecheck/lint/format only for packages about to be
# published, and it is skipped when there is nothing to release. It gates
# publishing, not pushes.
name: Verify

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack installed workspace
        run: tar --exclude=.git -cf "$RUNNER_TEMP/workspace.tar" .

      - name: Upload installed workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: ${{ runner.temp }}/workspace.tar
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download installed workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: ${{ runner.temp }}

      - name: Restore installed workspace
        run: tar -xf "$RUNNER_TEMP/workspace.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Build
        run: bun run build

      - name: Pack built workspace
        run: tar --exclude=.git -cf "$RUNNER_TEMP/workspace.tar" .

      - name: Upload built workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: ${{ runner.temp }}/workspace.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  spec-completion:
    name: Spec completion
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Every Spec: trailer must name a complete spec"
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..HEAD"
          else
            git fetch --no-tags origin "${BASE_REF}"
            range="origin/${BASE_REF}..HEAD"
          fi
          if git log --format=%B "${range}" | sed 's/\r$//' | grep -Eq '^Spec:[[:space:]]*$'; then
            echo "Empty Spec: trailer — name a spec or drop the line."
            exit 1
          fi
          trailers=$(git log --format=%B "${range}" \
            | sed -n 's/\r$//; s/^Spec:[[:space:]]*//p' \
            | sed 's/[[:space:]]*$//' \
            | sort -u)
          if [ -z "${trailers}" ]; then
            echo "No 'Spec: <name>' trailer in ${range}; nothing to gate."
            exit 0
          fi
          while IFS= read -r spec; do
            [ -n "${spec}" ] || continue
            if ! printf '%s' "${spec}" | grep -Eq '^[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "Invalid Spec: trailer '${spec}' — use a kebab-case spec name."
              exit 1
            fi
            echo "::group::Spec '${spec}' must be complete"
            bun run --cwd packages/specs cli check --dir "$GITHUB_WORKSPACE" \
              --name "${spec}" --require-complete
            echo "::endgroup::"
          done <<< "${trailers}"

  verify:
    name: ${{ matrix.target }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lint
            script: lint:check
          - target: format
            script: format:check
          - target: typecheck
            script: ts:check
          - target: test
            script: test
          - target: tui
            script: test:tui
          - target: smoke
            script: smoke
          - target: skills
            script: mf:check:release-and-skills
          - target: prompts
            script: mf:check:prompts
          - target: specs
            script: mf:check:specs
          - target: profiles
            script: mf:check:profiles
          - target: reviews
            script: mf:check:reviews
    steps:
      - uses: actions/checkout@v4

      - name: Download built workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: ${{ runner.temp }}

      - name: Restore built workspace
        run: tar -xf "$RUNNER_TEMP/workspace.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Run ${{ matrix.target }}
        run: bun run ${{ matrix.script }}
