# Repo-wide verification gate.
#
# Runs on every pull request, merge queue entry, push to `main`, and on
# demand, so a failure is caught before it lands on `main` instead of after.
# Feature-branch pushes only trigger the `pull_request` run (no duplicate
# `push` run), which halves the runner minutes per PR update.
#
# Shape:
#   install  -> checkout, `bun install`, pack the workspace *including*
#               `node_modules` into one artifact (`workspace-installed`).
#   build    -> restore that artifact, run every package build once, repack
#               the workspace *including* the build outputs (and Turbo's
#               local cache) into one artifact (`workspace-built`).
#   verify-early -> matrix of checks that do not need a build (lint,
#                   format). Runs off `workspace-installed` right after
#                   `install`, without waiting for `build`.
#   verify   -> matrix of the remaining checks. Each cell restores the built
#               workspace, so install and build happen exactly once per run
#               instead of once per check. The matrix then runs fully in
#               parallel.
#   The `test` check is split into three shards (test-a/b/c) so the
#   18 packages run on three runners instead of one. Each shard disables
#   vitest typechecking (`--typecheck.enabled=false`): the separate
#   `typecheck` cell already runs `ts:check` via `turbo ts:check`, so the
#   test cells must not typecheck a second time. Local `turbo test` keeps
#   `--typecheck` for fast local feedback.
#
# The workspace travels as a single `tar` (not as loose files) because
# `node_modules` is full of symlinks and hardlinks, and zip-based artifacts
# do not round-trip those correctly. `.git` is excluded; each job does its own
# `actions/checkout` so Turborepo keeps a stable git root for its hashing.
#
# `TURBO_CACHE_DIR` is pointed at `.turbo/cache` inside the workspace so the
# cache built by the `build` job travels with the artifact. The verify cells
# then satisfy their `^build` dependencies from that cache instead of
# rebuilding their dependencies.
#
# Each matrix cell runs one check through a root script (`package.json`) so a
# failure names a single target and CI, the local `mf:gate` script,
# and the Lefthook pre-push hook all execute the same commands.
#
# Boundary with `release.yml`: that workflow is untouched. Its `checks` job
# runs per-package test/typecheck/lint/format only for packages about to be
# published, and it is skipped when there is nothing to release. It gates
# publishing, not pushes.
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  TURBO_CACHE_DIR: .turbo/cache
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache Bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack installed workspace
        run: tar --exclude=.git -cf "$RUNNER_TEMP/workspace.tar" .

      - name: Upload installed workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-installed
          path: ${{ runner.temp }}/workspace.tar
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download installed workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-installed
          path: ${{ runner.temp }}

      - name: Restore installed workspace
        run: tar -xf "$RUNNER_TEMP/workspace.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Build
        run: bun run build

      - name: Pack built workspace
        run: tar --exclude=.git -cf "$RUNNER_TEMP/workspace.tar" .

      - name: Upload built workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-built
          path: ${{ runner.temp }}/workspace.tar
          retention-days: 1
          if-no-files-found: error

  verify-early:
    name: ${{ matrix.target }}
    needs: [install]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: lint
            script: lint:check
          - target: format
            script: fmt:check
    steps:
      - uses: actions/checkout@v4

      - name: Download installed workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-installed
          path: ${{ runner.temp }}

      - name: Restore installed workspace
        run: tar -xf "$RUNNER_TEMP/workspace.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Run ${{ matrix.target }}
        run: bun run ${{ matrix.script }}

  verify:
    name: ${{ matrix.target }}
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: typecheck
            script: ts:check
          - target: test-a
            script: test:shard-a
          - target: test-b
            script: test:shard-b
          - target: test-c
            script: test:shard-c
          - target: tui
            script: test:tui
          - target: smoke
            script: smoke
          - target: skills
            script: mf-release:check-and-skills
          - target: prompts
            script: mf-prompts:check
          - target: profiles
            script: mf-profiles:check
          - target: reviews
            script: mf-reviews:check
          - target: references
            script: mf-references:check
          - target: principles
            script: mf-principles:check
          - target: playbooks
            script: mf-playbooks:check
          - target: feature
            script: mf-feature:check
    steps:
      - uses: actions/checkout@v4

      - name: Download built workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace-built
          path: ${{ runner.temp }}

      - name: Restore built workspace
        run: tar -xf "$RUNNER_TEMP/workspace.tar" -C "$GITHUB_WORKSPACE"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Run ${{ matrix.target }}
        run: bun run ${{ matrix.script }}
